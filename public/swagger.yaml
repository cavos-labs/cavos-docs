  # Wallet Information Endpoints
  /api/v1/external/wallet/balance:
    post:
      tags:
        - Wallet Information
      summary: Get Wallet Balance
      description: |
        Retrieves the token balance for a specific wallet address. Supports ERC20 tokens on Starknet.
        
        **Features:**
        - Automatically determines network from wallet record
        - Supports any ERC20 token by specifying contract address
        - Returns both human-readable and raw balance values
        
        **How it works:**
        1. Validates organization authentication (org token or app_id)
        2. Looks up wallet in database to determine network
        3. Queries token contract balance on Starknet
        4. Converts raw balance to human-readable format using decimals
      operationId: getWalletBalance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                address:
                  type: string
                  description: Wallet address to check balance for
                tokenAddress:
                  type: string
                  description: ERC20 token contract address (defaults to USDC on Starknet)
                  default: "0x053c91253bc9682c04929ca02ed00b3e423f6710d2ee7e0d5ebb06f3ecf368a8"
                decimals:
                  type: integer
                  description: Token decimals for conversion (defaults to 6 for USDC)
                  default: 6
              required:
                - address
      responses:
        '200':
          description: Balance retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  balance:
                    type: number
                    description: Token balance in human-readable format (converted using decimals)
                  balanceRaw:
                    type: string
                    description: Raw token balance from contract (in smallest unit)
                required:
                  - balance
                  - balanceRaw
        '400':
          description: Bad request - missing wallet address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - invalid org token or app_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Wallet not found for organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error - RPC configuration error or contract query failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

