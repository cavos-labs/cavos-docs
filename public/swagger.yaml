openapi: 3.1.0
info:
  title: Aegis Cavos API
  description: |
    A comprehensive wallet provider service for Starknet with Auth0 integration, supporting multiple authentication methods including Apple Sign In and Google OAuth.
    
    ## Overview
    Aegis Cavos is a comprehensive wallet deployment and management service that enables developers and businesses to create fully functional smart accounts on Starknet with a single API call. Built with complete gas fee abstraction through AVNU's paymaster integration.
    
    ## Key Features
    - **Invisible Wallets**: No seed phrases, no browser extensions. Users authenticate with email or social login
    - **Gas Fee Abstraction**: Complete gas fee handling through AVNU paymaster
    - **Multi-Network Support**: Sepolia testnet and Mainnet environments
    - **Smart Contract Execution**: Execute transactions with simplified API
    - **User Authentication**: Auth0 integration for secure user management
    - **Organization Management**: Multi-tenant architecture with org-based isolation
    
    ## Authentication
    Before using the Aegis Cavos API, you must register your organization at [https://services.cavos.xyz](https://services.cavos.xyz) to get your App ID and API Secret.
    
    ## Support & Community
    - **Official Website**: [https://aegis.cavos.xyz/](https://aegis.cavos.xyz/)
    - **Discord Community**: [https://discord.gg/JzCj6vFtAT](https://discord.gg/JzCj6vFtAT) - Join for support and updates
  version: 1.0.0
  contact:
    name: Aegis Cavos Support
    url: https://aegis.cavos.xyz/
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: https://services.cavos.xyz
    description: Production server
  - url: https://aegis.cavos.xyz
    description: Development server

security:
  - BearerAuth: []
  - AppIdAuth: []

paths:
  # Authentication Endpoints
  /api/v1/external/auth/apple:
    get:
      tags:
        - Authentication
      summary: Initiate Apple Sign In
      description: |
        Initiates Apple Sign In authentication flow. Returns an Auth0 URL that the user should be redirected to for authentication.
        
        **Flow:**
        1. Call this endpoint with your organization's App ID
        2. Redirect user to the returned URL
        3. User completes Apple authentication
        4. User is redirected to your callback URL with auth code
        5. Process the callback to get user data and wallet info
      operationId: initiateAppleAuth
      parameters:
        - name: network
          in: query
          required: false
          description: Target network for wallet deployment
          schema:
            type: string
            enum: [sepolia, mainnet]
            default: sepolia
        - name: final_redirect_uri
          in: query
          required: true
          description: URL to redirect user after successful authentication
          schema:
            type: string
            format: uri
        - name: app_id
          in: query
          required: true
          description: Your organization's App ID
          schema:
            type: string
      responses:
        '200':
          description: Authentication URL generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
                    description: Auth0 authorization URL for Apple Sign In
                required:
                  - url
        '400':
          description: Bad request - missing required parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - invalid app_id or organization not active for mainnet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security: []

  /api/v1/external/auth/google:
    get:
      tags:
        - Authentication
      summary: Initiate Google OAuth
      description: |
        Initiates Google OAuth authentication flow. Returns an Auth0 URL that the user should be redirected to for authentication.
        
        **Flow:**
        1. Call this endpoint with your organization's App ID
        2. Redirect user to the returned URL
        3. User completes Google authentication
        4. User is redirected to your callback URL with auth code
        5. Process the callback to get user data and wallet info
      operationId: initiateGoogleAuth
      parameters:
        - name: network
          in: query
          required: false
          description: Target network for wallet deployment
          schema:
            type: string
            enum: [sepolia, mainnet]
            default: sepolia
        - name: final_redirect_uri
          in: query
          required: true
          description: URL to redirect user after successful authentication
          schema:
            type: string
            format: uri
        - name: app_id
          in: query
          required: true
          description: Your organization's App ID
          schema:
            type: string
      responses:
        '200':
          description: Authentication URL generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
                    description: Auth0 authorization URL for Google OAuth
                required:
                  - url
        '400':
          description: Bad request - missing required parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - invalid app_id or organization not active for mainnet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security: []

  /api/v1/external/auth/apple/callback:
    get:
      tags:
        - Authentication
      summary: Apple Sign In Callback
      description: |
        Handles the callback from Apple Sign In authentication. This endpoint processes the authorization code and exchanges it for user data and wallet information.
        
        **Note:** This endpoint is called automatically by Auth0 after user authentication. You should not call it directly.
      operationId: handleAppleCallback
      parameters:
        - name: code
          in: query
          required: true
          description: Authorization code from Auth0
          schema:
            type: string
        - name: state
          in: query
          required: false
          description: State parameter for CSRF protection
          schema:
            type: string
        - name: network
          in: query
          required: true
          description: Target network
          schema:
            type: string
            enum: [sepolia, mainnet]
        - name: org_id
          in: query
          required: true
          description: Organization ID
          schema:
            type: string
        - name: app_id
          in: query
          required: true
          description: App ID
          schema:
            type: string
        - name: final_redirect_uri
          in: query
          required: true
          description: Final redirect URI
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to final_redirect_uri with user data
        '400':
          description: Bad request - invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security: []

  /api/v1/external/auth/google/callback:
    get:
      tags:
        - Authentication
      summary: Google OAuth Callback
      description: |
        Handles the callback from Google OAuth authentication. This endpoint processes the authorization code and exchanges it for user data and wallet information.
        
        **Note:** This endpoint is called automatically by Auth0 after user authentication. You should not call it directly.
      operationId: handleGoogleCallback
      parameters:
        - name: code
          in: query
          required: true
          description: Authorization code from Auth0
          schema:
            type: string
        - name: state
          in: query
          required: false
          description: State parameter for CSRF protection
          schema:
            type: string
        - name: network
          in: query
          required: true
          description: Target network
          schema:
            type: string
            enum: [sepolia, mainnet]
        - name: org_id
          in: query
          required: true
          description: Organization ID
          schema:
            type: string
        - name: app_id
          in: query
          required: true
          description: App ID
          schema:
            type: string
        - name: final_redirect_uri
          in: query
          required: true
          description: Final redirect URI
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to final_redirect_uri with user data
        '400':
          description: Bad request - invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security: []

  /api/v1/external/auth/login:
    post:
      tags:
        - Authentication
      summary: User Login with Email and Password
      description: |
        Authenticates a user with email and password credentials. If the user doesn't have a wallet for the specified network, one will be automatically created.
        
        **Flow:**
        1. Validates organization credentials (org token or app_id)
        2. Authenticates user with Auth0 using email/password
        3. Retrieves or creates wallet for the user
        4. Returns user data, wallet information, and access tokens
        
        **Note:** This endpoint validates network access and user creation limits based on your organization's subscription.
      operationId: userLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: User email address
                password:
                  type: string
                  format: password
                  description: User password
                network:
                  type: string
                  enum: [sepolia, mainnet]
                  default: sepolia
                  description: Target network for wallet deployment
              required:
                - email
                - password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Success message
                  data:
                    type: object
                    properties:
                      user_id:
                        type: string
                        description: Auth0 user ID
                      email:
                        type: string
                        format: email
                        description: User email address
                      organization:
                        type: object
                        properties:
                          org_id:
                            type: string
                            description: Organization ID
                          org_name:
                            type: string
                            description: Organization name
                      wallet:
                        allOf:
                          - $ref: '#/components/schemas/WalletInfo'
                          - type: object
                            properties:
                              private_key:
                                type: string
                                description: Private key is excluded from response
                      authData:
                        $ref: '#/components/schemas/AuthData'
                      walletStatus:
                        $ref: '#/components/schemas/WalletStatusInfo'
                    required:
                      - user_id
                      - email
                      - organization
                      - authData
        '400':
          description: Bad request - missing required fields or invalid network
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - invalid credentials, invalid org token, or organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - organization not active for mainnet or subscription limits exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error - login or wallet creation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/external/auth/register:
    post:
      tags:
        - Authentication
      summary: Register New User Account
      description: |
        Creates a new user account with email and password authentication. A wallet is automatically created for the user on the specified network.
        
        **Password Requirements:**
        - Minimum 8 characters
        - At least one uppercase letter
        - At least one lowercase letter
        - At least one number
        
        **Flow:**
        1. Validates organization credentials (org token or app_id)
        2. Validates email format and password strength
        3. Creates user in Auth0
        4. Automatically deploys a wallet for the user
        5. Returns user data, wallet information, and access tokens
        
        **Note:** This endpoint validates network access and user creation limits based on your organization's subscription.
      operationId: userRegister
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: User email address
                password:
                  type: string
                  format: password
                  description: User password (min 8 chars, must include uppercase, lowercase, and number)
                network:
                  type: string
                  enum: [sepolia, mainnet]
                  default: sepolia
                  description: Target network for wallet deployment
                user_metadata:
                  type: object
                  description: Optional user metadata to store with the Auth0 user
                  additionalProperties: true
              required:
                - email
                - password
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Success message
                  data:
                    type: object
                    properties:
                      user_id:
                        type: string
                        description: Auth0 user ID
                      email:
                        type: string
                        format: email
                        description: User email address
                      organization:
                        type: object
                        properties:
                          org_id:
                            type: string
                            description: Organization ID
                          org_name:
                            type: string
                            description: Organization name
                      wallet:
                        allOf:
                          - $ref: '#/components/schemas/WalletInfo'
                          - type: object
                            properties:
                              private_key:
                                type: string
                                description: Private key is excluded from response
                      user_metadata:
                        type: object
                        description: User metadata
                        additionalProperties: true
                      created_at:
                        type: string
                        format: date-time
                        description: Account creation timestamp
                      authData:
                        $ref: '#/components/schemas/AuthData'
                      walletStatus:
                        $ref: '#/components/schemas/WalletStatusInfo'
                    required:
                      - user_id
                      - email
                      - organization
                      - created_at
                      - authData
        '400':
          description: Bad request - missing required fields, invalid email format, weak password, or invalid network
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - invalid org token or organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - organization not active for mainnet or subscription limits exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict - user already exists in this organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error - registration or wallet creation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/external/auth/password/reset:
    post:
      tags:
        - Authentication
      summary: Request Password Reset
      description: |
        Triggers a password reset email for users who have forgotten their password. The reset link will be sent to the user's email address.
        
        **Security Note:** This endpoint always returns a success response to prevent user enumeration attacks. If an account exists with the provided email, a password reset link will be sent.
        
        **Flow:**
        1. Validates organization using app_id
        2. Determines Auth0 connection based on network
        3. Sends password reset email via Auth0
        4. Returns generic success message
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: Email address of the user requesting password reset
                app_id:
                  type: string
                  description: Your organization's App ID
                network:
                  type: string
                  enum: [sepolia, mainnet]
                  description: Network to determine Auth0 connection
              required:
                - email
                - app_id
                - network
      responses:
        '200':
          description: Password reset request processed (always returns success for security)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Generic success message
                    example: If an account exists with this email, you will receive a password reset link
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        description: Confirmation message
                      timestamp:
                        type: integer
                        description: Request timestamp in milliseconds
                    required:
                      - message
                      - timestamp
        '400':
          description: Bad request - missing required fields, invalid email format, or invalid network
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error - configuration or processing error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/external/auth/session/recover:
    post:
      tags:
        - Authentication
      summary: Recover User Session
      description: |
        Recovers a complete user session using an access token. If the token is expired, it will automatically attempt to refresh it. Returns complete authentication context including user info, organization details, wallet data, and new tokens.
        
        **Use Cases:**
        - Restore user session after app reload
        - Validate and refresh expired tokens
        - Get complete user context including wallet information
        
        **Flow:**
        1. Validates access token (or refreshes if expired)
        2. Validates organization using app_id
        3. Fetches user information from Auth0
        4. Ensures wallet exists (creates if needed)
        5. Generates new access and refresh tokens
        6. Returns complete session data
      operationId: recoverSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                app_id:
                  type: string
                  description: Your organization's App ID
              required:
                - app_id
      responses:
        '200':
          description: Session recovered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Success message
                  data:
                    type: object
                    properties:
                      user_id:
                        type: string
                        description: Auth0 user ID
                      email:
                        type: string
                        format: email
                        description: User email address
                      organization:
                        type: object
                        properties:
                          org_id:
                            type: string
                            description: Organization ID
                          org_name:
                            type: string
                            description: Organization name
                      wallet:
                        allOf:
                          - $ref: '#/components/schemas/WalletInfo'
                          - type: object
                            properties:
                              private_key:
                                type: string
                                description: Private key is excluded from response
                      authData:
                        $ref: '#/components/schemas/AuthData'
                      walletStatus:
                        $ref: '#/components/schemas/WalletStatusInfo'
                    required:
                      - user_id
                      - email
                      - organization
                      - authData
        '400':
          description: Bad request - missing app_id or invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - invalid or expired access token (refresh failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - access token does not belong to this organization or network access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User or organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded - too many requests to Auth0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error - session recovery failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/external/auth/delete:
    post:
      tags:
        - Authentication
      summary: Delete User Account
      description: |
        Deletes a user account from both Auth0 and Supabase, removing all authentication credentials and wallet records.
        
        **Important:** This operation is irreversible. All user data, wallets, and authentication credentials will be permanently deleted.
        
        **Process:**
        1. Validates the access token and organization
        2. Deletes the user from Auth0
        3. Deletes all associated wallets from Supabase
        4. Returns confirmation with deletion details
      operationId: deleteUserAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                app_id:
                  type: string
                  description: Your organization's App ID
              required:
                - app_id
      responses:
        '200':
          description: Account deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Success message
                  data:
                    $ref: '#/components/schemas/AccountDeleteResponse'
        '400':
          description: Bad request - missing or invalid app_id, malformed JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - invalid or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - access token does not belong to this organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded - too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error - deletion failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Wallet Management Endpoints
  /api/v1/external/deploy:
    post:
      tags:
        - Wallet Management
      summary: Deploy Smart Account
      description: |
        Deploys a new ArgentX smart account on Starknet. The wallet is automatically created with gas fee abstraction through AVNU paymaster.
        
        **Features:**
        - Automatic ArgentX smart account deployment
        - Gas fee abstraction (no gas fees for users)
        - Support for both Sepolia and Mainnet
        - Automatic wallet storage and management
      operationId: deployWallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                network:
                  type: string
                  enum: [sepolia, mainnet]
                  description: Target network for wallet deployment
                auth0_uid:
                  type: string
                  description: Auth0 user ID (optional, for user-specific wallets)
              required:
                - network
      responses:
        '200':
          description: Wallet deployed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  public_key:
                    type: string
                    description: Public key of the deployed wallet
                  private_key:
                    type: string
                    description: Encrypted private key (for internal use)
                  address:
                    type: string
                    description: Wallet address on Starknet
                required:
                  - public_key
                  - private_key
                  - address
        '400':
          description: Bad request - invalid parameters or organization not active for mainnet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - invalid API secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error during wallet deployment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/external/wallet/export/request-otp:
    post:
      tags:
        - Wallet Management
      summary: Request OTP for Private Key Export
      description: |
        Requests a one-time password (OTP) to be sent to the user's email for exporting their wallet's private key. This is a security measure to prevent unauthorized access to sensitive wallet information.
        
        **Security Features:**
        - 6-digit OTP code sent via email
        - OTP expires in 10 minutes
        - Rate limiting to prevent abuse
        - Cooldown period between OTP requests
        - Blocking after multiple failed attempts
        
        **Flow:**
        1. Validates access token
        2. Checks rate limits and cooldowns
        3. Retrieves user's wallet from database
        4. Generates 6-digit OTP
        5. Stores OTP in Redis (expires in 10 minutes)
        6. Sends OTP to user's email
        7. Returns success confirmation
        
        **Note:** After receiving the OTP, use the export endpoint with the OTP code to retrieve the private key.
      operationId: requestExportOTP
      responses:
        '200':
          description: OTP sent successfully to user's email
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Success message
                  data:
                    type: object
                    properties:
                      email:
                        type: string
                        format: email
                        description: Email address where OTP was sent
                      expiresIn:
                        type: integer
                        description: OTP expiration time in seconds (600 seconds = 10 minutes)
                      timestamp:
                        type: integer
                        description: Request timestamp in milliseconds
                    required:
                      - email
                      - expiresIn
                      - timestamp
        '401':
          description: Unauthorized - invalid or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Wallet not found for user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded - too many OTP requests or failed attempts
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  error:
                    type: string
                    enum: [RATE_LIMIT_EXCEEDED, TEMPORARILY_BLOCKED, OTP_COOLDOWN]
                  retryAfter:
                    type: integer
                    description: Seconds to wait before retrying
        '500':
          description: Internal server error - failed to send email or store OTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/external/wallet/export/verify:
    post:
      tags:
        - Wallet Management
      summary: Verify OTP and Export Private Key
      description: |
        Verifies the OTP code sent to the user's email and exports the decrypted private key if verification succeeds. This is the second step in the wallet export process after requesting an OTP.
        
        **Security Features:**
        - Validates 6-digit OTP code
        - OTP is single-use (invalidated after successful verification)
        - Rate limiting on failed attempts
        - Daily export limit to prevent abuse
        - Blocks user after multiple failed attempts
        - Clears failed attempts counter on success
        
        **Flow:**
        1. Validates access token
        2. Validates OTP format (6 digits)
        3. Checks rate limits and failed attempts
        4. Validates OTP against stored value
        5. Invalidates OTP (one-time use)
        6. Retrieves encrypted private key from database
        7. Decrypts private key using organization hash secret
        8. Records successful export
        9. Returns decrypted private key with security warning
        
        **Important:** The private key is returned in plain text. Store it securely and never share it with anyone.
      operationId: verifyExportOTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                otp:
                  type: string
                  description: 6-digit OTP code received via email
                  pattern: '^\\d{6}$'
                  example: "123456"
              required:
                - otp
      responses:
        '200':
          description: OTP verified successfully and private key exported
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Success message
                  data:
                    type: object
                    properties:
                      private_key:
                        type: string
                        description: Decrypted private key (store securely!)
                      wallet_address:
                        type: string
                        description: Wallet address associated with the private key
                      warning:
                        type: string
                        description: Security warning about private key storage
                    required:
                      - private_key
                      - wallet_address
                      - warning
        '400':
          description: Bad request - missing OTP or invalid OTP format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - invalid or expired access token, or invalid/expired OTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Wallet not found for user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded - too many failed attempts, daily limit exceeded, or temporarily blocked
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  error:
                    type: string
                    enum: [RATE_LIMIT_EXCEEDED, TEMPORARILY_BLOCKED, DAILY_LIMIT_EXCEEDED]
                  retryAfter:
                    type: integer
                    description: Seconds to wait before retrying
        '500':
          description: Internal server error - decryption failed or database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/external/execute:
    post:
      tags:
        - Smart Contract Execution
      summary: Execute Smart Contract Calls
      description: |
        Executes smart contract calls on Starknet using the specified wallet. All transactions are gasless through AVNU paymaster integration.
        
        **Features:**
        - Gasless transaction execution
        - Support for multiple contract calls in a single transaction
        - Automatic transaction signing
        - Real-time transaction status
      operationId: executeContractCalls
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                network:
                  type: string
                  enum: [sepolia, mainnet]
                  description: Target network
                calls:
                  type: array
                  description: Array of contract calls to execute
                  items:
                    $ref: '#/components/schemas/ContractCall'
                address:
                  type: string
                  description: Wallet address to execute from
              required:
                - network
                - calls
                - address
      responses:
        '200':
          description: Transaction executed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    properties:
                      transactionHash:
                        type: string
                        description: Transaction hash on Starknet
                      status:
                        type: string
                        description: Transaction status
                    required:
                      - transactionHash
                      - status
        '400':
          description: Bad request - invalid parameters or organization not active for mainnet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - invalid API secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Wallet not found for organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error during execution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

