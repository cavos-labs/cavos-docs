components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        API Secret token for organization authentication. 
        Get your API Secret from your Aegis Cavos organization dashboard at https://services.cavos.xyz
    AppIdAuth:
      type: apiKey
      in: query
      name: app_id
      description: |
        App ID for organization identification.
        Get your App ID from your Aegis Cavos organization dashboard at https://services.cavos.xyz

  schemas:
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: Error message
        error:
          type: string
          description: Additional error details
        details:
          type: string
          description: Detailed error information
      required:
        - message

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Authentication success status
        data:
          type: object
          properties:
            user_id:
              type: string
              description: Auth0 user ID
            org_id:
              type: string
              description: Organization ID
            email:
              type: string
              format: email
              description: User email
            wallet:
              $ref: '#/components/schemas/WalletInfo'
            created_at:
              type: string
              format: date-time
              description: Account creation timestamp
            authData:
              $ref: '#/components/schemas/AuthData'
            walletStatus:
              $ref: '#/components/schemas/WalletStatusInfo'
          required:
            - user_id
            - org_id
            - email
            - authData
      required:
        - success
        - data

    WalletInfo:
      type: object
      properties:
        address:
          type: string
          description: Wallet address on Starknet
        public_key:
          type: string
          description: Wallet public key
        private_key:
          type: string
          description: Encrypted private key (for internal use)
        network:
          type: string
          enum: [sepolia, mainnet]
          description: Network where wallet is deployed
        user_id:
          type: string
          description: Associated Auth0 user ID
        org_id:
          type: string
          description: Organization ID
        id:
          type: string
          description: Wallet ID
        created_at:
          type: string
          format: date-time
          description: Wallet creation timestamp
        auth0_user:
          type: object
          properties:
            user_id:
              type: string
            email:
              type: string
              format: email
            name:
              type: string
            nickname:
              type: string
            picture:
              type: string
              format: uri
          description: Auth0 user information

    AuthData:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token
        refreshToken:
          type: string
          description: Refresh token for token renewal
        expiresIn:
          type: integer
          description: Token expiration time in seconds
        timestamp:
          type: integer
          description: Token creation timestamp
        user_id:
          type: string
          description: Auth0 user ID
        email:
          type: string
          format: email
          description: User email
        org_id:
          type: string
          description: Organization ID
      required:
        - accessToken
        - refreshToken
        - expiresIn
        - timestamp
        - user_id
        - email
        - org_id

    WalletStatusInfo:
      type: object
      properties:
        deploymentFailed:
          type: boolean
          description: Whether wallet deployment failed
        message:
          type: string
          description: Status message

    ContractCall:
      type: object
      properties:
        contractAddress:
          type: string
          description: Target contract address
        entrypoint:
          type: string
          description: Function name to call
        calldata:
          type: array
          items:
            type: string
          description: Function parameters
      required:
        - contractAddress
        - entrypoint
        - calldata

    TransactionInfo:
      type: object
      properties:
        hash:
          type: string
          description: Transaction hash
        timestamp:
          type: integer
          description: Transaction timestamp
        actual_fee:
          type: string
          description: Actual transaction fee
        org_id:
          type: integer
          description: Organization ID
        status:
          type: string
          description: Transaction status
        network:
          type: string
          enum: [sepolia, mainnet]
          description: Network where transaction was executed

    TokenTransfer:
      type: object
      properties:
        token:
          type: string
          description: Token symbol
        from:
          type: string
          description: Sender address
        to:
          type: string
          description: Recipient address
        amount:
          type: string
          description: Transfer amount

    TransactionEvent:
      type: object
      properties:
        name:
          type: string
          description: Event name
        from:
          type: string
          description: From address
        to:
          type: string
          description: To address
        amount:
          type: string
          description: Event amount
        contractAlias:
          type: string
          description: Contract alias
        timestamp:
          type: integer
          description: Event timestamp

    AccountDeleteResponse:
      type: object
      properties:
        user_id:
          type: string
          description: Auth0 user ID that was deleted
        email:
          type: string
          format: email
          description: Email address of the deleted user
        org_id:
          type: string
          description: Organization ID
        deletedWalletsCount:
          type: integer
          description: Number of wallets that were deleted
        alreadyDeletedFromAuth0:
          type: boolean
          description: Whether the user was already deleted from Auth0 (optional)
        timestamp:
          type: integer
          description: Deletion timestamp in milliseconds
      required:
        - user_id
        - email
        - org_id
        - deletedWalletsCount
        - timestamp

tags:
  - name: Authentication
    description: User authentication and session management
  - name: Wallet Management
    description: Smart account deployment and management
  - name: Smart Contract Execution
    description: Execute smart contract calls and transactions
  - name: Wallet Information
    description: Retrieve wallet data and balances
  - name: Transactions
    description: Transaction history and details
  - name: Analytics
    description: Analytics and metrics
  - name: Utilities
    description: Utility functions and helpers