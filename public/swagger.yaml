  /api/v1/external/wallet/transactions:
    get:
      tags:
        - Transactions
      summary: Get User Wallet Transactions
      description: |
        Retrieves transactions for all wallets belonging to the authenticated user. Transactions are filtered by user ID and organization ID from the access token.
        
        **Features:**
        - Returns transactions for all user wallets
        - Supports filtering by wallet address
        - Supports pagination with limit and offset
        - Automatically filters by network from token
        
        **How it works:**
        1. Validates access token (Bearer token)
        2. Extracts user_id, org_id, and network from token
        3. Queries all wallets for the user
        4. Returns transactions with pagination support
      operationId: getUserWalletTransactions
      parameters:
        - name: address
          in: query
          required: false
          description: Filter by specific wallet address
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of transactions to return per wallet
          schema:
            type: integer
            minimum: 1
        - name: offset
          in: query
          required: false
          description: Number of transactions to skip per wallet (for pagination)
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Wallet transactions retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Request success status
                  user_id:
                    type: string
                    description: User ID from token
                  org_id:
                    type: string
                    description: Organization ID from token
                  wallets:
                    type: array
                    description: Array of wallets with their transactions
                    items:
                      type: object
                      properties:
                        address:
                          type: string
                          description: Wallet address
                        network:
                          type: string
                          enum: [sepolia, mainnet]
                          description: Network where wallet is deployed
                        created_at:
                          type: string
                          format: date-time
                          description: Wallet creation timestamp
                        total_transactions:
                          type: integer
                          description: Total number of transactions for this wallet
                        transactions:
                          type: array
                          description: Paginated list of transactions
                          items:
                            type: object
                            description: Transaction object (structure depends on stored format)
                required:
                  - success
                  - user_id
                  - org_id
                  - wallets
        '400':
          description: Bad request - invalid token or missing required fields in token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - missing, invalid, or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No wallets found for user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
